name: docmind

services:
  
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ../${ENV_FILE:-envs/dev.env}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file:
      - ../${ENV_FILE:-envs/dev.env}

    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data


  backend:
    image: docmind-backend:local
    build:
      context: ..
      dockerfile: infra/DockerFile.backend
    env_file:
      - ../${ENV_FILE:-envs/dev.env}
    depends_on:
      postgres:
          condition: service_healthy
      redis:
          condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app 
      - ../backend/alembic:/app/backend/alembic   
      - ../alembic.ini:/app/alembic.ini:ro 
      - docling_cache:/root/.cache
      - storage_data:/var/lib/docmind/storage
      - hf_cache:/app/.cache/huggingface

    environment:
      HF_HOME: /app/.cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]

  worker:
    image: docmind-backend:local
    pull_policy: never     
    env_file:
      - ../${ENV_FILE:-envs/dev.env}
    depends_on:
      backend:
        condition: service_started       # backend at least starts
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/backend/alembic
      - ../alembic.ini:/app/alembic.ini:ro
      - docling_cache:/root/.cache
      - storage_data:/var/lib/docmind/storage
      - hf_cache:/app/.cache/huggingface

    command: ["arq", "app.workers.settings.WorkerSettings"]

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq app.workers.settings.WorkerSettings > /dev/null || exit 1'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    environment:
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "0"        # ← was "1"
      TRANSFORMERS_OFFLINE: "0"  # ← was "1"
      HF_HUB_DISABLE_XET: "1"

volumes:
  pg_data:
  redis_data:
  docling_cache:
  storage_data:
  hf_cache:
