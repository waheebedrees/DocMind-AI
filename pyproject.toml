[project]
name = "docmind-ai"
version = "0.1.0"
description = "DocMind AI — production-style RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq[watch]>=0.25.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "chonkie>=1.7.0",
    "docling>=2.129.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "aioboto3>=15.5.0",
    "filetype>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asyncpg-stubs>=0.31.3",
    "types-aiobotocore-s3>=3.9.1",
    "asgi-lifespan>=2.1.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' or sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "BLE", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "unit: fast tests with no external I/O",
    "integration: tests that need a real database or redis",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "backend"


[[tool.mypy.overrides]]
module = ["magic"]
ignore_missing_imports = true
