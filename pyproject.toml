[project]
name = "docmind-ai"
version = "0.1.0"
description = "DocMind AI — production-style RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq[watch]>=0.25.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "docling>=2.129.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asyncpg-stubs>=0.31.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "unit: fast tests with no external I/O",
    "integration: tests that need a real database or redis",
]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "BLE", "ASYNC"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]


